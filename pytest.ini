[tool:pytest]
# Configuração do pytest para testes de integração

# Diretórios de teste
testpaths = tests

# Padrões de arquivos de teste
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados
markers =
    integration: marca testes de integração
    unit: marca testes unitários
    slow: marca testes que demoram para executar
    github: marca testes que dependem da API do GitHub
    openai: marca testes que dependem da API da OpenAI
    docker: marca testes que requerem Docker
    database: marca testes que requerem banco de dados

# Configurações de saída
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --cov=tools
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=80
    --maxfail=5
    --durations=10

# Configurações de cobertura
cov_config = .coveragerc

# Filtros de warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Configurações de logging durante testes
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Configurações para testes assíncronos
asyncio_mode = auto

# Timeout para testes (em segundos)
timeout = 300

# Configurações para execução paralela
# Para usar: pytest -n auto
distribute = each
