# Configurações do Mock Server para testes de integração

# Configurações de logging
mockserver.logLevel=INFO
mockserver.disableSystemOut=false

# Configurações de CORS
mockserver.enableCORSForAPI=true
mockserver.enableCORSForAllResponses=true

# Configurações de SSL/TLS (desabilitado para testes)
mockserver.tlsMutualAuthenticationRequired=false

# Configurações de timeout
mockserver.maxSocketTimeout=120

# Configurações de memória
mockserver.maxExpectations=1000
mockserver.maxWebSocketExpectations=1000

# Configurações de persistência
mockserver.persistExpectations=false
mockserver.persistedExpectationsPath=/tmp/mockserver-expectations.json

# Configurações de proxy (desabilitado)
mockserver.proxyRemotePort=
mockserver.proxyRemoteHost=

# Configurações de verificação
mockserver.attemptToProxyIfNoMatchingExpectation=false
