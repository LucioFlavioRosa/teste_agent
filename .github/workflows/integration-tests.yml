name: Integration Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      # Exemplos de serviços, ajuste conforme dependências reais
      github-mock:
        image: wiremock/wiremock:2.32.0
        ports:
          - 8080:8080
      openai-mock:
        image: ghcr.io/mockoon/mockoon-cli:latest
        ports:
          - 3001:3001
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov requests-mock responses
      - name: Run integration tests
        run: pytest tests/integration/ --cov=agents --cov=tools --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: integration
          name: integration-tests
